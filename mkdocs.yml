site_name: NeuroQP Python
site_description: Python SDK and CLI for NeuroQP project exports
site_author: NeuroQP
repo_url: https://github.com/neuroqp/neuroqp-python
repo_name: neuroqp/neuroqp-python
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/brand/neuroqp-logo-text.png
  favicon: assets/brand/neuroqp-logo-icon-transparent.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: neuroqp-light
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: neuroqp-dark
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            filters:
              - "!^_"
            heading_level: 2
            merge_init_into_class: false
            members_order: source
            separate_signature: true
            show_bases: false
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true
  - mkdocs-jupyter:
      allow_errors: false
      execute: true
      include_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/neuroqp/neuroqp-python
      name: NeuroQP Python on GitHub

nav:
  - Overview: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Example notebooks:
          - Examples: examples/index.md
          - Open and navigate: examples/open-and-navigate.ipynb
          - Validate an export: examples/validate-export.ipynb
  - Concepts:
      - Project exports: concepts/exports.md
      - Object model: concepts/object-model.md
  - Guides:
      - Navigate a project: guides/navigation.md
      - Images and masks: guides/images.md
      - Validate and inspect: guides/validation-cli.md
      - Classification and matches: guides/classification.md
      - Low-level access: guides/low-level.md
  - API reference:
      - Entry points: reference/functions.md
      - Project objects: reference/objects.md
      - Scientific results: reference/results.md
      - Metadata models: reference/models.md
      - Exceptions: reference/errors.md
  - Export specifications:
      - Current specification: specifications/index.md
      - Export v2: specifications/export-v2.md
  - Changelog: changelog.md
  - Support: support.md
