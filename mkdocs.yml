site_name: NeuroQP Python
site_description: Python SDK and CLI for NeuroQP project exports
site_url: https://python.neuroqp.com/
site_author: NeuroQP
repo_url: https://github.com/neuroqp/neuroqp-python
repo_name: neuroqp/neuroqp-python
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/brand/neuroqp-logo-text.png
  favicon: assets/brand/neuroqp-logo-icon-transparent.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: neuroqp-light
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: neuroqp-dark
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            filters:
              - "!^_"
            heading_level: 2
            merge_init_into_class: false
            members_order: source
            separate_signature: true
            show_bases: false
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true
  - mkdocs-jupyter:
      allow_errors: false
      execute: true
      include_source: true
  - llmstxt:
      full_output: llms-full.txt
      preprocess: scripts/llmstxt_preprocess.py
      markdown_description: |
        Use these pages to write Python analyses for NeuroQP project exports.
        Start with the quickstart, then use the guides, API reference, and export
        specification as needed. The complete documentation is available in
        [llms-full.txt](llms-full.txt).
      sections:
        Overview:
          - index.md: What NeuroQP Python offers for export-based neuroscience analysis.
        Getting started:
          - getting-started/installation.md: Install NeuroQP Python for an analysis environment.
          - getting-started/ai-coding-agents.md: Use the installable skill or online AI-readable documentation with Codex, Claude Code, and other coding agents.
          - getting-started/quickstart.md: Open an export and begin navigating project data.
        Example notebooks:
          - examples/index.md: Choose and download an executable example notebook.
          - examples/open-and-navigate.ipynb: Open an export and navigate its project objects.
          - examples/validate-export.ipynb: Validate an export before starting an analysis.
        Concepts:
          - concepts/exports.md: Understand export containers, files, limits, and access patterns.
          - concepts/object-model.md: Understand project objects and their lifecycle.
        Guides:
          - guides/navigation.md: Find animals, slices, stainings, images, and registrations.
          - guides/images.md: Inspect and process small or very large exported images.
          - guides/validation-cli.md: Validate and inspect exports from the command line.
          - guides/classification.md: Interpret and aggregate classification and match results.
          - guides/low-level.md: Access export members and metadata directly.
        API reference:
          - reference/functions.md: Public package entry points.
          - reference/objects.md: Export, project, and image objects.
          - reference/results.md: Classification and cell-match result objects.
          - reference/models.md: Validated metadata models.
          - reference/errors.md: Public exceptions and failure conditions.
        Export specifications:
          - specifications/index.md: Supported NeuroQP export format versions.
          - specifications/export-v2.md: Complete NeuroQP export format v2 specification.
        Project information:
          - changelog.md: User-visible package changes.
          - support.md: Support channels and issue-reporting guidance.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/neuroqp/neuroqp-python
      name: NeuroQP Python on GitHub

nav:
  - Overview: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - AI coding agents: getting-started/ai-coding-agents.md
      - Quickstart: getting-started/quickstart.md
      - Example notebooks:
          - Examples: examples/index.md
          - Open and navigate: examples/open-and-navigate.ipynb
          - Validate an export: examples/validate-export.ipynb
  - Concepts:
      - Project exports: concepts/exports.md
      - Object model: concepts/object-model.md
  - Guides:
      - Navigate a project: guides/navigation.md
      - Images and masks: guides/images.md
      - Validate and inspect: guides/validation-cli.md
      - Classification and matches: guides/classification.md
      - Low-level access: guides/low-level.md
  - API reference:
      - Entry points: reference/functions.md
      - Project objects: reference/objects.md
      - Scientific results: reference/results.md
      - Metadata models: reference/models.md
      - Exceptions: reference/errors.md
  - Export specifications:
      - Current specification: specifications/index.md
      - Export v2: specifications/export-v2.md
  - Changelog: changelog.md
  - Support: support.md
