version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    # Security PRs are exempt from this limit; ordinary version updates stay off.
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
