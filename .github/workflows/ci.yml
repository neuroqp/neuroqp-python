name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.12" }
          - { os: macos-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv build
      - run: uv venv --python 3.14 .package-venv
      - run: uv pip install --python .package-venv/bin/python dist/*.whl
      - run: .package-venv/bin/python -c "import importlib.metadata; import neuroqp; assert neuroqp.__version__ == importlib.metadata.version('neuroqp')"
      - run: .package-venv/bin/neuroqp --help
      - run: |
          mkdir "$RUNNER_TEMP/skill-install"
          cd "$RUNNER_TEMP/skill-install"
          "$GITHUB_WORKSPACE/.package-venv/bin/neuroqp" skill install --agent all
          test -s .agents/skills/neuroqp-python/SKILL.md
          test -s .claude/skills/neuroqp-python/SKILL.md
      - run: uv run python scripts/build_skill_release.py --output-dir "$RUNNER_TEMP/skill-release"
      - run: test -s "$RUNNER_TEMP/skill-release/manifest.json"

  documentation:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --group docs
      - run: uv run python scripts/build_example_export.py --check
      - run: uv run mkdocs build --strict
      - name: Verify AI-readable documentation
        run: |
          test -s site/llms.txt
          test -s site/llms-full.txt
          test -s site/reference/functions/index.md
          test -s site/examples/open-and-navigate/index.md
          grep -q "https://python.neuroqp.com/reference/functions/index.md" site/llms.txt
          grep -q "open_export" site/reference/functions/index.md
          grep -q "PROJECT_FILE" site/examples/open-and-navigate/index.md
          ! grep -q "^:::" site/reference/functions/index.md
          ! grep -q "Copied!" site/examples/open-and-navigate/index.md
