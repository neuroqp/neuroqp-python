name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv build
      - run: uv venv --python 3.14 .package-venv
      - run: uv pip install --python .package-venv/bin/python dist/*.whl
      - run: .package-venv/bin/python -c "import neuroqp; assert neuroqp.__version__ == '0.1.0.dev0'"
      - run: .package-venv/bin/neuroqp --help
