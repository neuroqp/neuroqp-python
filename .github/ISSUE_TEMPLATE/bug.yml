name: Bug report
description: Report reproducible incorrect behavior in the SDK or CLI
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach private project exports. Use a minimal synthetic example or redacted validation output.
  - type: input
    id: version
    attributes:
      label: NeuroQP Python version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: Python 3.14 on Ubuntu 26.04
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Export source
      options:
        - ZIP archive
        - Extracted directory
        - Not export-related
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command or Python code and any synthetic fixture needed.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and full error
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private exports, credentials, and sensitive research data.
          required: true
